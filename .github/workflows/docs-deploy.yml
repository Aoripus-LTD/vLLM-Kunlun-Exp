name: docs-deploy

on:
  push:
    branches:
      - qwen38-dev

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install mkdocs-material
        run: |
          pip install mkdocs-material
      # 注意：mkdocs 的 -d（site_dir）相对配置文件目录（qwen_docs/）解析，
      # 用 working-directory 对齐 cwd 与 config 目录，../site 落盘到仓库根 site/
      - name: Build docs to subpath (branch qwen38-dev)
        working-directory: qwen_docs
        run: |
          mkdocs build --strict -d ../site/qwen38-dev
      - name: Install branch landing page
        working-directory: qwen_docs
        run: |
          cp ../.github/pages-landing/index.html ../site/index.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
