name: docs-deploy

on:
  push:
    branches:
      - qwen38-dev

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install mkdocs-material
        run: |
          pip install mkdocs-material
      - name: Build docs to subpath (branch qwen38-dev)
        run: |
          mkdocs build --strict -f qwen_docs/mkdocs.yml -d site/qwen38-dev
      - name: Install branch landing page
        run: |
          cp .github/pages-landing/index.html site/index.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
